version: 2

sources:
  - name: staging
    description: "Silver layer data loaded into PostgreSQL by Dagster staging assets."
    schema: staging
    tables:
      - name: pageviews
        description: >
          Daily pageview data loaded from silver Parquet partitions.
        meta:
          dagster:
            asset_key: ["pg_stg_pageviews"]
      - name: articles
        description: >
          Article metadata loaded from silver Parquet.
        meta:
          dagster:
            asset_key: ["pg_stg_articles"]
