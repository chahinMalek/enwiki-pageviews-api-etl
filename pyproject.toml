[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikipulse"
version = "0.1.0"
description = "End-to-end local ETL pipeline for ingesting daily top-viewed Wikipedia articles from the Wikimedia Pageviews API."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    # Orchestration
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "dagster-postgres>=0.25.0",
    "dagster-dbt>=0.25.0",

    # Data processing
    "polars>=1.0.0",
    "pyarrow>=18.0.0",
    "pandas>=2.0.0",

    # Database
    "psycopg2-binary>=2.9.0",

    # dbt
    "dbt-core>=1.9.0",
    "dbt-postgres>=1.9.0",

    # API client
    "httpx>=0.27.0",

    # Publishing
    "huggingface-hub>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
